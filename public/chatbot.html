VEX MATCH TERMINOLOGY — know these inside out:
ROUND TYPES:
- Qualifier / Q# = Qualification match (regular season matches, everyone plays these)
- QF = Quarter Finals (top 8 alliances, elimination round)
- SF = Semi Finals (top 4 alliances, elimination round)
- F = Finals (top 2 alliances, championship match)
- R16 = Round of 16 (top 16 alliances, elimination round at large events)
- Skills = Robot Skills / Programming Skills (individual timed runs, not head-to-head)

MATCH FORMAT (each match has 2 alliances of 2 teams):
- Each row = one match, format: [Event Name] Round MatchNum: Team1+Team2 Score vs Team3+Team4 Score (WIN/LOSS/TIE)
- The WIN/LOSS/TIE label is already computed from 1831M's perspective — trust it directly, don't recompute from scores yourself
- The two teams joined by "+" = alliance partners for that match
- Scores shown are total alliance scores (both robots combined)

ELIMINATION BRACKET NAMING (e.g. "QF #1-1"):
- First number = which bracket/matchup (e.g. QF #1 = quarterfinal bracket 1)
- Second number = which game in that series (best of 3, so #1-1, #1-2, possibly #1-3)

RANKINGS explained:
- WP = Win Points (main ranking metric, 2 per win, 1 per tie, 0 per loss)
- AP = Autonomous Points (bonus from winning autonomous period)
- SP = Strength of Schedule Points (average losing alliance score — rewards tough schedule)
- Rank = position on the leaderboard at that event

ALLIANCE SELECTION (after qualifications):
- Top 8 ranked teams become "alliance captains" and pick 1 partner each
- Higher ranked captains pick first
- This forms the 8 alliances that compete in eliminations

const INTENT_SHORTCUTS = [
  { key: 'awards', patterns: [/\b(list|show|tell me|what are|what were|our|all|full)\b.*\bawards?\b/, /\bwhat.*\bawards?\b.*\b(won|win|received)\b/, /\b(list|show|tell me|our|all|full)\b.*\btroph(?:y|ies)\b/, /\bwhat.*(have (you|we)|has 1831).*(won|win)\b/] },
  { key: 'whyPickUs', patterns: [/\bwhy (pick|choose) (you|1831)/, /\bwhy should we (pick|choose|use|take)/, /\bwhat makes (you|1831m)/, /\bsecret sauce\b/] },
  { key: 'whoAreWe', patterns: [/\bwho (are|is) (you|1831m)\b/, /\btell me about (yourself|the team|1831m)\b/, /\babout (the )?team\b/] },
  { key: 'contact',  patterns: [/\bcontact\b/, /\bemail address\b/, /\bhow (do|can) i (contact|reach|email)/, /\bget in touch\b/] },
  { key: 'scare',    patterns: [/\bscare\b/, /\bengineering process\b/, /\bmike wazowski\b/] },
];

function matchIntentShortcut(t) {
  for (const s of INTENT_SHORTCUTS) {
    if (s.patterns.some(p => p.test(t))) return s.key;
  }
  return null;
}

function buildContextWindow() {
  const orientation = {role:'system', content:`VISITOR VIEW CONTEXT (orientation only): The visitor is currently viewing the “${pageContext.title}” section of the 1831M website. ${pageContext.description} Use this only when it helps answer naturally; do not claim the visitor asked about this section, and do not invent facts from it.`};

// Extract specific facts (numbers, team numbers, proper nouns) from a response
function extractFacts(text) {
  const teams = text.match(/\b\d{3,5}[A-Z]\b/g) || [];
  const scores = text.match(/\b\d{1,3}-\d{1,3}\b/g) || [];
  const years = text.match(/\b20\d{2}\b/g) || [];
  const rounds = text.match(/\b(QF|SF|R16|Finals?|Qualifier)\s*#?\d*/gi) || [];
  return [...teams, ...scores, ...years, ...rounds].map(f => f.toLowerCase());
}

function factsMatch(a, b) {
  const fa = extractFacts(a), fb = extractFacts(b);
  for (const f of fa) {
    if (fb.length && !fb.includes(f) && fb.some(x => x.match(/\d/))) return false;
  }
  return true;
}

    const res = await fetch(CHAT_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        keyIndex: 0,
        stream: true,
        messages: [
          {role:'system',content:SYS + getViewportContext() + (liveData ? '\n\nLIVE VEX EVENTS DATA:\n' + liveData : '')},
          ...buildContextWindow()
        ]
      })
    });
    if (!res.ok || !res.body) return { ok:false, status: res.status };

    // Keep the typing indicator visible until the first actual response token.
    const loadingMessage = document.getElementById('ty');
    const bubbleEl = loadingMessage?.querySelector('.bbl') || addBot('');
    const loadingStatus = bubbleEl.querySelector('.loading-status');
    const loadingLines = getLoadingLines(questionText);
    let loadingStage = 0;
    const loadingTimer = setInterval(() => {
      if (loadingStatus) {
        loadingStage = (loadingStage + 1) % loadingLines.length;
        loadingStatus.textContent = loadingLines[loadingStage];
        loadingStatus.style.animation = 'none';
        void loadingStatus.offsetWidth;
        loadingStatus.style.animation = '';
      }
    }, 5200);
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '', fullText = '', firstToken = true;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed.startsWith('data:')) continue;
        const payload = trimmed.slice(5).trim();
        if (payload === '[DONE]' || !payload) continue;
        try {
          const json = JSON.parse(payload);
          const delta = json.choices?.[0]?.delta?.content || '';
          if (delta) {
            fullText += delta;
            if (firstToken) {
              firstToken = false;
              clearInterval(loadingTimer);
              if (loadingMessage) loadingMessage.removeAttribute('id');
            }
            bubbleEl.innerHTML = formatReply(fullText);
            $M.scrollTop = $M.scrollHeight;
          }
        } catch(e) { /* ignore partial/malformed SSE chunk */ }
      }
    }

    clearInterval(loadingTimer);
    if (!fullText) { bubbleEl.closest('.msg')?.remove(); return { ok:false, status:'empty' }; }
    if (/^\s*(User Safety|Response Safety)\s*:/im.test(fullText)) {
      bubbleEl.closest('.msg')?.remove();
      return { ok:false, status:'classifier_response' };
    }
    return { ok:true, text: fullText, bubbleEl };
  } catch(e) {
    if (typeof loadingTimer !== 'undefined') clearInterval(loadingTimer);
    console.warn('❌ Stream failed:', e.message);
    return { ok:false, status:'exception' };
  }
}

// Second "primary" — routed through our own Gemini proxy function (key stays server-side)
async function getGeminiReply(answerBeingChecked = '') {
  // Gemini 3.5 Flash-Lite requires the final GenerateContent turn to be a
  // user turn. The main OpenRouter answer has already been appended to history
  // before background checking starts, so remove that trailing assistant turn.
  // Also omit the website-orientation system message; SYS is sent separately
  // as Gemini's systemInstruction.
  const context = buildContextWindow().filter(m => m.role !== 'system');
  if (context.length && context[context.length - 1].role === 'assistant' &&
      (!answerBeingChecked || context[context.length - 1].content === answerBeingChecked)) {
    context.pop();
  }
  // Gemini conversations should start and finish on a visitor turn.
  while (context.length && context[0].role === 'assistant') context.shift();
  while (context.length && context[context.length - 1].role === 'assistant') context.pop();
  const contents = context.map(m => ({
    role: m.role === 'assistant' ? 'model' : 'user',
    parts: [{ text: m.content }]
  }));
  if (!contents.length || contents[contents.length - 1].role !== 'user') {
    return { ok: false, status: 'no_user_turn_for_gemini' };
  }
  try {
    const res = await fetch(GEMINI_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        systemPrompt: SYS + `\n\nVISITOR VIEW CONTEXT: The visitor is viewing the “${pageContext.title}” section. ${pageContext.description}` + (liveData ? '\n\nLIVE VEX EVENTS DATA:\n' + liveData : ''),
        contents
      })
    });
    console.log(`🤖 Gemini proxy: ${res.status}`);
    if (!res.ok) return { ok: false, status: res.status };
    return await res.json();
  } catch(e) {
    console.warn('❌ Gemini proxy threw:', e.message);
    return { ok: false, status: 'exception' };
  }
}

// SMART FACT-CHECK (item 4): instead of guessing upfront whether a question
// needs verification, we answer fast first, then only double-check in the
// background if the answer actually contains a checkable fact (a team
// number, score, year, or round). Purely conversational replies never
// trigger this — that's what makes the common case fast.
async function verifyInBackground(text, bubbleEl) {
  try {
    const r2 = await getGeminiReply(text);
    if (!r2.ok) { console.log('🧪 Background check: Gemini unavailable, leaving answer as-is'); return; }
    if (factsMatch(text, r2.text)) { console.log('✅ Background check: facts confirmed'); return; }

    console.warn('⚠️ Background fact mismatch — asking judge...');
    let judgeChoice = null;
    try {
      const judgeRes = await fetch(CHAT_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          judge: true,
          messages: [{
            role: 'user',
            content: `You are a fact checker. Based on this reference data:\n${liveData}\n\nWhich response has more accurate facts — respond with ONLY "1" or "2" or "unclear".\n\nResponse 1: ${text.substring(0,500)}\n\nResponse 2: ${r2.text.substring(0,500)}`
          }]
        })
      });
      if (judgeRes.ok) {
        const jd = await judgeRes.json();
        const verdict = (jd.text || '').trim().toLowerCase();
        console.log('⚖️ AI judge verdict:', verdict);
        if (verdict.includes('1')) judgeChoice = '1';
        else if (verdict.includes('2')) judgeChoice = '2';
      }
    } catch(e) {
      console.warn('⚖️ Judge failed:', e.message);
    }

    if (judgeChoice === '2') {
      console.warn('✏️ Judge picked the verified answer — correcting the displayed reply');
      bubbleEl.innerHTML = formatReply(r2.text) + `<div class="corrected-note">✏️ Updated for accuracy</div>`;
      for (let i = history.length - 1; i >= 0; i--) {
        if (history[i].role === 'assistant' && history[i].content === text) { history[i].content = r2.text; break; }
      }
    } else {
      console.log('✅ Judge kept the original answer (or unclear) — no change shown');
    }
  } catch(e) {
    console.warn('Background verification failed:', e.message);
  }
}

async function handleAI(text, alreadyAdded=false){
  if(busy)return;
  busy=true;$S.disabled=true;
  showT(text);

  try {
    let result = await streamReply(text);

    if (!result.ok) {
      console.warn('⚠️ Stream failed, retrying with a different key (non-streaming)...');
      const retry = await getReply(3);
      if (!retry.ok) {
        // Gemini is also a real response fallback, not only a background fact checker.
        // It uses the same private Netlify-hosted GEMINI_API_KEY.
        const backup = await getGeminiReply();
        hideT();
        if (!backup.ok || !backup.text) {
          addBot(`Hmm, having trouble connecting. Try again or email <a href='mailto:contact.1831m@gmail.com'>contact.1831m@gmail.com</a>.`);
          busy=false;$S.disabled=false;$I.focus();
          return;
        }
        const bubbleEl = addBot(formatReply(backup.text));
        result = { ok:true, text: backup.text, bubbleEl, source:'gemini' };
      } else {
        hideT();
        const bubbleEl = addBot(formatReply(retry.text));
        result = { ok:true, text: retry.text, bubbleEl };
      }
    }

    history.push({role:'assistant',content:result.text});
    if(history.length>40) history=history.slice(-40);
    setTimeout(()=>renderBtns(['Plan an alliance','Our awards','Talk to someone','Main menu']),300);
    busy=false;$S.disabled=false;$I.focus();

    // Only spend a second call double-checking answers that actually assert
    // specific facts — most casual replies skip this entirely.
    if (result.source !== 'gemini' && extractFacts(result.text).length > 0) {
      verifyInBackground(result.text, result.bubbleEl);
    }
  } catch(e) {
    hideT();
    addBot("Network error — check your connection or email <a href='mailto:contact.1831m@gmail.com'>contact.1831m@gmail.com</a>.");
    busy=false;$S.disabled=false;$I.focus();
  }
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

function formatReply(raw) {
  // Some models return HTML-style formatting tags instead of Markdown.
  // Convert only these known formatting tags; escape all other HTML below.
  const normalized = String(raw).replace(/\\([*_~])/g, '$1')
    .replace(/<\s*(strong|b)\s*>/gi, '**')
    .replace(/<\s*\/\s*(strong|b)\s*>/gi, '**')
    .replace(/<\s*(em|i)\s*>/gi, '*')
    .replace(/<\s*\/\s*(em|i)\s*>/gi, '*')
    .replace(/<\s*(s|strike|del)\s*>/gi, '~~')
    .replace(/<\s*\/\s*(s|strike|del)\s*>/gi, '~~')
    .replace(/<\s*br\s*\/?>/gi, '\n')
    .replace(/<\s*\/?\s*p\s*>/gi, '\n')
    .replace(/<\s*li\s*>/gi, '\n- ')
    .replace(/<\s*\/\s*li\s*>/gi, '')
    .replace(/<\s*\/?\s*(ul|ol)\s*>/gi, '\n');

  return escapeHtml(normalized)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/~~(.+?)~~/g, '<s>$1</s>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/__(.+?)__/g, '<strong>$1</strong>')
    .replace(/_(.+?)_/g, '<em>$1</em>')
    .replace(/^#{1,3} (.+)$/gm, '<strong>$1</strong>')
    .replace(/^[-•] (.+)$/gm, '• $1')
    .replace(/\n\n/g, '<br><br>')
    .replace(/\n/g, '<br>');
}
